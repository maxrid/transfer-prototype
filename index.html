<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Bank — Transfer</title>
  <link rel="stylesheet" href="src/tokens.css">
  <link rel="stylesheet" href="src/transfer.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="icon-button" aria-label="Back">&#8592;</button>
      <h1>Send money</h1>
      <span class="step">Step 2 of 3</span>
    </header>

    <main class="screen">
      <section class="field-group">
        <label class="field">
          <span class="field-label">From</span>
          <div class="account">
            <div class="account-icon" style="--tone:#0f95d8"></div>
            <div>
              <div class="account-name">Everyday account</div>
              <div class="account-meta">•••• 4821 · Available 2,480.00 THB</div>
            </div>
          </div>
        </label>

        <label class="field">
          <span class="field-label">To</span>
          <div class="account">
            <div class="account-icon" style="--tone:#8b46e8"></div>
            <div>
              <div class="account-name">Pip Studio Co.</div>
              <div class="account-meta">•••• 1180 · Saved recipient</div>
            </div>
          </div>
        </label>

        <label class="field">
          <span class="field-label">Amount</span>
          <div class="amount">
            <span class="currency">THB</span>
            <input class="amount-input" type="text" inputmode="decimal" value="1,250.00" aria-label="Amount">
          </div>
        </label>

        <label class="field">
          <span class="field-label">Note (optional)</span>
          <input class="text-input" type="text" value="Design review, September">
        </label>
      </section>

      <section class="summary">
        <div class="summary-row"><span>Transfer fee</span><strong>0.00 THB</strong></div>
        <div class="summary-row"><span>Arrives</span><strong>Instantly</strong></div>
        <div class="summary-row total"><span>Total</span><strong>1,250.00 THB</strong></div>
      </section>
    </main>

    <footer class="actions">
      <button class="button button-secondary">Cancel</button>
      <button class="button button-confirm">Confirm transfer</button>
    </footer>
  </div>
</body>
</html>
